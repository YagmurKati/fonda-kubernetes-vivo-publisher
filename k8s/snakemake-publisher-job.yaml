apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: fonda-vivo-snakemake-publisher
    app.kubernetes.io/managed-by: fonda-kubernetes-vivo-publisher
    fonda.hu-berlin.de/run-id: "__RUN_ID_LABEL__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fonda-vivo-snakemake-publisher
        app.kubernetes.io/managed-by: fonda-kubernetes-vivo-publisher
        fonda.hu-berlin.de/run-id: "__RUN_ID_LABEL__"
    spec:
      serviceAccountName: __SERVICE_ACCOUNT__
      restartPolicy: Never
      containers:
        - name: collect-and-publish
          image: nextflow/nextflow@sha256:b035b9fa7243ed09b9896c2b752d9e399f337827932bd45495efb0aed8e1dca1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              output_dir="${RUN_ROOT}/vivo-outbox"
              artifact_base="${RUN_ID}-${OUTPUT_STAMP}"
              ttl_file="${output_dir}/${artifact_base}.ttl"
              receipt_file="${output_dir}/${artifact_base}.published.json"
              mkdir -p "$output_dir"

              if [[ "$DRY_RUN" != "1" && "$FORCE_REPUBLISH" != "1" ]]; then
                shopt -s nullglob
                receipts=("$output_dir/${RUN_ID}-"*.published.json)
                for receipt in "${receipts[@]}"; do
                  if ! grep -Eq '"removed_at"[[:space:]]*:' "$receipt"; then
                    printf 'A publication receipt already exists for %s: %s\n' \
                      "$RUN_ID" "$receipt" >&2
                    printf '%s\n' \
                      'Set FORCE_REPUBLISH=1 only after reviewing the existing VIVO record.' >&2
                    exit 4
                  fi
                done
              fi

              python3 /opt/fonda-vivo/collector.py \
                --run-id "$RUN_ID" \
                --input-metadata-file /opt/fonda-vivo/input_datasets.json \
                --output-file "$ttl_file"

              publisher_args=(
                python3 /opt/fonda-vivo/publisher.py
                "$ttl_file"
                --endpoint "$VIVO_ENDPOINT"
                --graph "$VIVO_GRAPH"
                --email-file /var/run/secrets/fonda-vivo/email
                --password-file /var/run/secrets/fonda-vivo/password
                --receipt-file "$receipt_file"
              )
              if [[ "$DRY_RUN" == "1" ]]; then
                publisher_args+=(--dry-run)
              fi
              "${publisher_args[@]}"
          envFrom:
            - configMapRef:
                name: fonda-vivo-publisher-settings
          env:
            - name: NAMESPACE
              value: "__NAMESPACE__"
            - name: RUN_ID
              value: "__RUN_ID__"
            - name: OUTPUT_STAMP
              value: "__OUTPUT_STAMP__"
            - name: DRY_RUN
              value: "__DRY_RUN__"
            - name: FORCE_REPUBLISH
              value: "__FORCE_REPUBLISH__"
            - name: ELECTRICITY_MAPS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: electricity-maps-api-token
                  key: token
                  optional: true
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: publisher-code
              mountPath: /opt/fonda-vivo
              readOnly: true
            - name: vivo-credentials
              mountPath: /var/run/secrets/fonda-vivo
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: __PVC_NAME__
        - name: publisher-code
          configMap:
            name: fonda-vivo-publisher-code
        - name: vivo-credentials
          secret:
            secretName: __VIVO_SECRET__
            defaultMode: 0400
