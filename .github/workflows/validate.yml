name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Python syntax
        run: python -m py_compile collector/*.py publisher/*.py
      - name: Shell syntax
        run: bash -n scripts/*.sh scripts/lib/*.sh
      - name: Repository safety checks
        run: ./scripts/validate-repository.sh
