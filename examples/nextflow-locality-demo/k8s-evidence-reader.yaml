apiVersion: v1
kind: Pod
metadata:
  name: nextflow-locality-demo-evidence-reader
  namespace: yagmur
  labels:
    app.kubernetes.io/name: nextflow-locality-demo
    app.kubernetes.io/component: evidence-reader
    fonda.hu-berlin.de/run-id: NFL-DSL2-DEMO-RUN01
spec:
  restartPolicy: Never
  nodeSelector:
    usedby: prototyping
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: usedby
                operator: In
                values:
                  - prototyping
  containers:
    - name: reader
      image: alpine:3.19
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
      args:
        - sleep 1800
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
          readOnly: true
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: nextflow-locality-demo-workspace
        readOnly: true
